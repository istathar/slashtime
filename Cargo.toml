[package]
name = "slashtime"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
lto = true

[dependencies]
csv = "1.3"
crossterm = "0.27"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
tz-rs = "0.6"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
