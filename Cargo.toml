[package]
name = "slashtime"
version = "0.7.1"
edition = "2021"

[profile.release]
strip = true
lto = true

[dependencies]
csv = "1.3"
crossterm = "0.27"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
tz-rs = "0.7"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
skrifa = "0.44"
unicode-script = "0.5"
clap = { version = "4.5", features = ["wrap_help"] }

# Windows has no zoneinfo database, so a copy of the IANA data is embedded
# when building there.
[target.'cfg(windows)'.dependencies]
tzdb_data = "0.2"
iana-time-zone = "0.1"

[dev-dependencies]
egui_kittest = "0.36"

# Ordinary builds carry no debug info at all. Emitting it dominated both the
# build time and the size of the binary, and it is of no use unless a debugger
# is actually going to be attached.
[profile.dev]
debug = false

# When one is: cargo build --profile gdb
[profile.gdb]
inherits = "dev"
debug = true
split-debuginfo = "unpacked"
